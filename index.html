<body>
  <div id="app">
    <header class="topbar">
      <button class="icon-btn" id="backBtn" data-action="back" aria-label="Back" hidden>
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 id="title">Home</h1>
      <button class="icon-btn" data-action="open-search" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
      <button class="icon-btn" data-action="go" data-to="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Main">
      <span class="tab-ink" aria-hidden="true"></span>
      <button data-action="go" data-to="home" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Home</span>
      </button>
      <button data-action="go" data-to="budget" data-tab="budget">
        <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>
        <span>Budget</span>
      </button>
      <button data-action="go" data-to="shop" data-tab="shop">
        <svg viewBox="0 0 24 24"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
        <span>Shop</span>
      </button>
      <button data-action="go" data-to="calendar" data-tab="calendar">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span>Calendar</span>
      </button>
      <button data-action="go" data-to="gifts" data-tab="gifts">
        <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>
        <span>Gifts</span>
      </button>
    </nav>
  </div>

  <!-- Bottom sheet used for every add/edit form -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <button class="link-btn" data-action="sheet-cancel">Cancel</button>
      <h2 id="sheetTitle"></h2>
      <button class="link-btn strong" data-action="sheet-save" id="sheetSave">Save</button>
    </div>
    <form id="sheetForm" class="sheet-body" autocomplete="off"></form>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
  <script src="ui.js"></script>
  <script src="extras.js"></script>
  <script src="sync.js"></script>
</body>
</html>
