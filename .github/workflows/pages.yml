name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Collect site files
        run: |
          mkdir _site
          # Every app file, so a new script can never be left off the site
          cp -r *.html *.css *.js manifest.webmanifest icons vendor _site/
      - name: Check every file the app loads is on the site
        run: |
          missing=0
          for f in $(grep -oE '(src|href)="[^":#]+\.(js|css)"' index.html | sed -E 's/.*="([^"]+)"/\1/') $(grep -oE "'\./[^']+'" sw.js | tr -d "'" | sed 's#^\./##'); do
            [ -z "$f" ] && continue
            [ -e "_site/$f" ] || { echo "Missing on site: $f"; missing=1; }
          done
          exit $missing
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
