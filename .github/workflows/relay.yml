# Deploys the instant push relay (tools/relay/worker.js) to Cloudflare Workers (free plan).
# Does nothing until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are added (plus the notification secrets).
# After it runs, copy the "https://gomezfam-push.….workers.dev" address from the log into the app:
# Settings → Notifications → Instant.
name: Push relay
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/relay/**', '.github/workflows/relay.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check setup
        id: chk
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VPRIV: ${{ secrets.VAPID_PRIVATE_KEY }}
          FSA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CF" ] || [ -z "$ACC" ] || [ -z "$VPRIV" ] || [ -z "$FSA" ]; then echo "Relay isn't set up yet (secrets missing)"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.skip != '1'
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.skip != '1'
        with:
          node-version: 20
      - name: Deploy
        if: steps.chk.outputs.skip != '1'
        working-directory: tools/relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FSA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TM: ${{ secrets.TICKETMASTER_API_KEY }}
        run: |
          PID=$(node -e "process.stdout.write(JSON.parse(process.env.FSA).project_id)")
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          npx --yes wrangler@3.80.0 deploy --var "FIREBASE_PROJECT_ID:$PID" --var "ALLOWED_ORIGIN:https://$OWNER.github.io"
          printf '%s' "$VAPID_PUBLIC_KEY" | npx --yes wrangler@3.80.0 secret put VAPID_PUBLIC_KEY
          printf '%s' "$VAPID_PRIVATE_KEY" | npx --yes wrangler@3.80.0 secret put VAPID_PRIVATE_KEY
          if [ -n "$TM" ]; then printf '%s' "$TM" | npx --yes wrangler@3.80.0 secret put TICKETMASTER_API_KEY; fi
          echo "✅ Relay deployed. Paste the workers.dev address shown above into Settings → Notifications → Instant."
